<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Watchlist</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-title" content="Watchlist">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout idea: one narrow column, a plain checklist like a note; controls stay out of the way. Single light theme by choice, close to a notes app. */
:root {
  color-scheme: light;
  --ground: #FFFFFF;
  --surface: #F5F4F0;
  --line: #E4E2DC;
  --edge: #8E8B84;
  --ink: #1C1C1E;
  --muted: #5F5E5A;
  --accent: #F2B84B;
  --on-accent: #1C1C1E;
  --accent-ink: #8A5A00;
  --warn: #B3261E;
  --display: 'Space Grotesk', Inter, system-ui, sans-serif;
  --body: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.35; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }
header { padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 44px; }
.summary { font-size: 13px; color: var(--muted); margin-top: -8px; }
.round { width: 44px; height: 44px; flex-shrink: 0; padding: 0; border: 1px solid var(--edge); border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center; }
.round[aria-expanded="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.round.add { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.topbtns { display: flex; gap: 8px; }
.backdrop.top { align-items: flex-start; }
.backdrop.top .sheet { border-radius: 0 0 24px 24px; border-top: 0; border-bottom: 1px solid var(--edge); padding-top: 24px; }
.panel { display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.panel[hidden] { display: none; }
.group { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 13px; font-weight: 600; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--edge); background: transparent; font-size: 13px; font-weight: 500; }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); font-weight: 600; }
.switch { display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-size: 15px; font-weight: 500; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); }
.quiet { font-size: 13px; color: var(--muted); }
.textbtn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--edge); background: transparent; font-size: 14px; font-weight: 500; }
main { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 12px; -webkit-overflow-scrolling: touch; }
h2.type { margin: 8px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); line-height: 32px; position: sticky; top: 0; background: var(--ground); z-index: 1; }
ul { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; min-height: 44px; }
.tick { width: 44px; height: 44px; margin-left: -11px; flex-shrink: 0; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
.tick span { width: 22px; height: 22px; border: 1.5px solid var(--edge); border-radius: 11px; display: flex; align-items: center; justify-content: center; color: var(--on-accent); }
.tick[aria-checked="true"] span { background: var(--accent); border-color: var(--accent); }
.tick svg { display: none; }
.tick[aria-checked="true"] svg { display: block; }
.title { flex: 1; min-width: 0; min-height: 44px; padding: 5px 0; border: 0; background: transparent; text-align: left; overflow-wrap: anywhere; }
.title .note { font-size: 13px; color: var(--muted); margin-left: 6px; }
.title .love { color: var(--accent-ink); vertical-align: -3px; margin-left: 6px; }
.row.seen .title .name { color: var(--muted); }
.info { width: 44px; height: 44px; margin-right: -9px; flex-shrink: 0; padding: 0; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.info span { width: 26px; height: 26px; border: 1.5px solid var(--edge); border-radius: 13px; display: flex; align-items: center; justify-content: center; }
.empty { padding: 32px 0; color: var(--muted); font-size: 15px; }
footer { padding: 4px 20px 10px; background: var(--ground); }
.field input::placeholder { color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); max-width: calc(100% - 40px); padding: 6px 6px 6px 16px; border-radius: 14px; background: var(--ink); color: var(--ground); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; z-index: 5; }
.toast[hidden] { display: none; }
.toast button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--ground); color: var(--ink); font-size: 14px; font-weight: 600; }
.toast span { padding: 8px 10px 8px 0; }
.backdrop { position: fixed; inset: 0; background: rgba(28, 28, 30, 0.42); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.backdrop[hidden] { display: none; }
.sheet { width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; padding: 20px 20px 24px; border-radius: 24px 24px 0 0; background: var(--surface); border-top: 1px solid var(--edge); display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 27px; text-wrap: balance; overflow-wrap: anywhere; }
.sheethead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags:empty { display: none; }
.tag { height: 30px; padding: 0 12px; border-radius: 15px; background: var(--line); font-size: 13px; font-weight: 500; display: flex; align-items: center; }
.facts { display: flex; flex-direction: column; }
.fact { display: flex; justify-content: space-between; gap: 16px; min-height: 40px; padding: 8px 0; align-items: baseline; border-bottom: 1px solid var(--line); }
.fact dt { font-size: 13px; color: var(--muted); flex-shrink: 0; }
.fact dd { margin: 0; font-size: 14px; font-weight: 500; text-align: right; overflow-wrap: anywhere; }
.fact dd.later { color: var(--muted); font-weight: 400; }
.fact a { color: var(--accent-ink); }
dl { margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.primary { height: 48px; flex: 1; padding: 0 16px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 600; }
.secondary { height: 48px; padding: 0 16px; border: 1px solid var(--edge); border-radius: 14px; background: transparent; font-size: 15px; font-weight: 500; }
.secondary[aria-pressed="true"] { border-color: var(--accent-ink); color: var(--accent-ink); background: #FFF6DF; }
.danger { color: var(--warn); }
.edit { display: flex; flex-direction: column; gap: 12px; }
.edit[hidden] { display: none; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; color: var(--muted); }
.field input { height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--edge); background: var(--ground); font-size: 16px; }
.status { font-size: 12px; color: var(--muted); text-align: center; min-height: 16px; }
.status.bad { color: var(--warn); }
.banner { min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #FFF1CC; color: var(--ink); font-size: 14px; font-weight: 600; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.banner[hidden] { display: none; }
.banner span:last-child { color: var(--accent-ink); }
.cands { display: flex; flex-direction: column; }
.cand { display: flex; align-items: center; gap: 10px; min-height: 48px; border-bottom: 1px solid var(--line); }
.cand input[type="checkbox"] { width: 22px; height: 22px; flex-shrink: 0; accent-color: var(--accent-ink); }
.cand input[type="text"] { flex: 1; min-width: 0; height: 44px; padding: 0; border: 0; background: transparent; font-size: 16px; }
.cand small { font-size: 12px; color: var(--muted); flex-shrink: 0; }
.msg { font-size: 13px; color: var(--muted); min-height: 18px; }
.msg.bad { color: var(--warn); }
@media (prefers-reduced-motion: no-preference) { .backdrop:not([hidden]) .sheet { animation: up 180ms ease-out; } }
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="top">
    <h1>Watchlist</h1>
    <div class="topbtns">
      <button class="round" id="filterBtn" aria-label="Filter and sort" aria-expanded="false" aria-controls="panel">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
      </button>
      <button class="round add" id="addBtn" aria-label="Add a title">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>
  <div class="summary" id="summary">Loading the list</div>
  <button class="banner" id="inboxBanner" hidden><span id="inboxBannerText"></span><span>Review</span></button>
  <div class="panel" id="panel" hidden>
    <div class="group"><div class="label">Show</div><div class="pills" data-key="show">
      <button class="pill" data-v="unseen">Not seen</button><button class="pill" data-v="seen">Seen</button><button class="pill" data-v="loved">We loved</button><button class="pill" data-v="all">Everything</button>
    </div></div>
    <div class="group"><div class="label">Type</div><div class="pills" data-key="type">
      <button class="pill" data-v="all">All</button><button class="pill" data-v="movie">Movies</button><button class="pill" data-v="series">Series</button><button class="pill" data-v="podcast">Podcasts</button>
    </div></div>
    <div class="group"><div class="label">Sort</div><div class="pills" data-key="sort">
      <button class="pill" data-v="added">Last added</button><button class="pill" data-v="az">A to Z</button>
    </div></div>
    <label class="switch" for="groupToggle"><span>Group by type</span><input type="checkbox" id="groupToggle"></label>
    <div class="group">
      <div class="quiet" id="storeNote"></div>
      <div class="pills">
        <button class="textbtn" id="copyBtn">Copy list as text</button>
        <button class="textbtn" id="resetBtn" hidden>Reset to the original list</button>
        <button class="textbtn" id="demoBtn" hidden>Try the share-sheet screen</button>
        <button class="textbtn" id="connectBtn">Connect to GitHub</button>
      </div>
    </div>
  </div>
</header>

<main id="list" aria-live="off"></main>

<footer>
  <div class="status" id="status" role="status"></div>
</footer>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button id="toastBtn" hidden>Undo</button></div>

<div class="backdrop" id="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheethead">
      <div>
        <h2 id="sheetTitle"></h2>
        <div class="quiet" id="sheetMeta" style="margin-top:4px;font-size:14px"></div>
      </div>
      <button class="round" id="closeBtn" aria-label="Close">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="tags" id="sheetTags"></div>
    <dl class="facts" id="sheetFacts"></dl>
    <div class="actions">
      <button class="primary" id="seenBtn"></button>
      <button class="secondary" id="loveBtn" aria-pressed="false">We loved it</button>
    </div>
    <div class="actions">
      <button class="secondary" id="editBtn" aria-expanded="false" aria-controls="editBox">Edit</button>
      <button class="secondary danger" id="removeBtn">Remove</button>
    </div>
    <div class="edit" id="editBox" hidden>
      <div class="field"><label for="editTitle">Title</label><input id="editTitle" type="text"></div>
      <div class="field"><label for="editNote">Note</label><input id="editNote" type="text" placeholder="Platform, who tipped it, anything"></div>
      <div class="field"><label for="editTags">Labels, separated by spaces</label><input id="editTags" type="text" placeholder="cosy thriller"></div>
      <div class="field"><label for="editLinks">Other links, separated by spaces</label><input id="editLinks" type="text" placeholder="Spotify, Podimo or any other address" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="field"><label for="editImdb">IMDb link, optional</label><input id="editImdb" type="text" placeholder="Paste the film's IMDb address" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="group"><div class="label">Type</div><div class="pills" id="editTypes">
        <button class="pill" data-v="movie">Movie</button><button class="pill" data-v="series">Series</button><button class="pill" data-v="podcast">Podcast</button>
      </div></div>
      <button class="primary" id="saveEdit" style="flex:none">Save changes</button>
    </div>
  </div>
</div>

<div class="backdrop top" id="addBackdrop" hidden>
  <form class="sheet" id="addForm" role="dialog" aria-modal="true" aria-labelledby="addHeading" autocomplete="off">
    <div class="sheethead">
      <h2 id="addHeading">Add to the list</h2>
      <button class="round" type="button" id="addClose" aria-label="Close">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="field"><label for="addInput">Title</label><input id="addInput" type="text" placeholder="Film, series or podcast" enterkeyhint="done"></div>
    <div class="group"><div class="label">Type, guessed for you</div><div class="pills" id="addTypes">
      <button class="pill" type="button" data-v="movie">Movie</button><button class="pill" type="button" data-v="series">Series</button><button class="pill" type="button" data-v="podcast">Podcast</button>
    </div></div>
    <div class="field"><label for="addNote">Note, optional</label><input id="addNote" type="text" placeholder="Platform, who tipped it, anything"></div>
    <div class="field"><label for="addTags">Labels, optional</label><input id="addTags" type="text" placeholder="cosy thriller"></div>
    <button class="primary" type="submit" style="flex:none">Add</button>
  </form>
</div>

<div class="backdrop" id="inboxBackdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="inboxHeading">
    <div class="sheethead">
      <div>
        <h2 id="inboxHeading">From the share sheet</h2>
        <div class="quiet" id="inboxMeta" style="margin-top:4px"></div>
      </div>
      <button class="round" id="inboxClose" aria-label="Close">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="cands" id="inboxList"></div>
    <div class="group"><div class="label">Type for these</div><div class="pills" id="inboxTypes">
      <button class="pill" data-v="movie">Movie</button><button class="pill" data-v="series">Series</button><button class="pill" data-v="podcast">Podcast</button>
    </div></div>
    <div class="field"><label for="inboxTags">Labels for these, optional</label><input id="inboxTags" type="text" placeholder="cosy thriller"></div>
    <div class="actions">
      <button class="primary" id="inboxAdd">Add</button>
      <button class="secondary danger" id="inboxDiscard">Discard</button>
    </div>
  </div>
</div>

<div class="backdrop" id="ghBackdrop" hidden>
  <form class="sheet" id="ghForm" role="dialog" aria-modal="true" aria-labelledby="ghHeading" autocomplete="off">
    <div class="sheethead">
      <div>
        <h2 id="ghHeading">Connect to GitHub</h2>
        <div class="quiet" style="margin-top:4px">The list is then read from and saved to your repository. The token is kept on this phone only.</div>
      </div>
      <button class="round" type="button" id="ghClose" aria-label="Close">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="field"><label for="ghRepo">Repository, as username/name</label><input id="ghRepo" type="text" placeholder="username/watchlist" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label for="ghPath">List file</label><input id="ghPath" type="text" value="watchlist.md" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label for="ghToken">Access token</label><input id="ghToken" type="password" placeholder="github_pat_..." autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="msg" id="ghMsg" role="status"></div>
    <div class="actions">
      <button class="primary" type="submit" id="ghConnect">Connect</button>
      <button class="secondary danger" type="button" id="ghDisconnect" hidden>Disconnect</button>
    </div>
  </form>
</div>

<script src="core.js?v=3"></script>
<script>
(function () {
  'use strict';
  var C = window.WatchCore;
  var $ = function (id) { return document.getElementById(id); };
  var TYPE_LABEL = { movie: 'Movies', series: 'Series', podcast: 'Podcasts' };
  var TYPE_ONE = { movie: 'Movie', series: 'Series', podcast: 'Podcast' };
  var SHOW_LABEL = { unseen: 'Not seen', seen: 'Seen', loved: 'We loved', all: 'Everything' };
  var CHECK = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var INFO = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 11v7"/><path d="M12 6v0.2"/></svg>';
  var BALLOON = '<svg class="love" role="img" aria-label="We loved it" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="9" rx="6" ry="7"/><path d="M12 16v1.5c-2 2 2 2.5 0 4.5"/></svg>';

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  var state = { head: '', items: [], view: { show: 'unseen', type: 'all', sort: 'added', group: true }, open: null, addType: null };
  try { var v = JSON.parse(store.get('watchlist-view') || 'null'); if (v) Object.assign(state.view, v); } catch (e) {}

  /* ---------- storage: this phone (preview) or a GitHub file ---------- */
  var gh = null;
  try { gh = JSON.parse(store.get('watchlist-github') || 'null'); } catch (e) {}
  var remoteSha = null, pending = [], saving = false, original = '';

  function setStatus(text, bad) { var s = $('status'); s.textContent = text || ''; s.classList.toggle('bad', !!bad); }

  function ghApi(path, cfg) { cfg = cfg || gh; return 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + path.split('/').map(encodeURIComponent).join('/'); }
  function ghHeaders(cfg) { cfg = cfg || gh; var h = { 'Accept': 'application/vnd.github+json' }; if (cfg.token) h['Authorization'] = 'Bearer ' + cfg.token; return h; }
  function ghFail(r) { var e = new Error('GitHub answered ' + r.status); e.status = r.status; return e; }
  function ghRead(path, cfg) {
    return fetch(ghApi(path, cfg), { headers: ghHeaders(cfg), cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw ghFail(r); return r.json(); })
      .then(function (j) { return { sha: j.sha, text: C.fromBase64(j.content || '') }; });
  }
  function ghLoad(cfg) { return ghRead((cfg || gh).path, cfg).then(function (f) { if (!cfg) remoteSha = f.sha; return f.text; }); }
  function ghSave(text) {
    return fetch(ghApi(gh.path), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify({ message: 'Update watchlist', content: C.toBase64(text), sha: remoteSha }) })
      .then(function (r) {
        if (r.status === 409 || r.status === 422) { var e = new Error('conflict'); e.conflict = true; throw e; }
        if (!r.ok) throw ghFail(r);
        return r.json();
      }).then(function (j) { remoteSha = j.content.sha; });
  }
  function ghInboxList() {
    return fetch(ghApi('inbox'), { headers: ghHeaders(), cache: 'no-store' })
      .then(function (r) { if (r.status === 404) return []; if (!r.ok) throw ghFail(r); return r.json(); })
      .then(function (a) { return Array.isArray(a) ? a.filter(function (f) { return f.type === 'file'; }) : []; });
  }
  function ghDelete(file) {
    return fetch(ghApi(file.path), { method: 'DELETE', headers: ghHeaders(), body: JSON.stringify({ message: 'Clear watchlist inbox', sha: file.sha }) })
      .then(function (r) { if (!r.ok && r.status !== 404) throw ghFail(r); });
  }
  function whenIdle(cb) { if (!saving && !pending.length) cb(); else setTimeout(function () { whenIdle(cb); }, 400); }

  function load() {
    if (gh) {
      return ghLoad().then(function (text) { original = text; return text; });
    }
    return fetch('watchlist.md', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('The list file did not load (' + r.status + ')'); return r.text(); })
      .then(function (text) { original = text; var local = store.get('watchlist-md'); return local || text; });
  }

  function boot() {
    $('storeNote').textContent = gh ? 'Saving to ' + gh.owner + '/' + gh.repo : 'Draft: changes stay on this phone. Nothing is sent anywhere yet.';
    $('resetBtn').hidden = !!gh; $('demoBtn').hidden = !!gh;
    $('connectBtn').textContent = gh ? 'GitHub connection' : 'Connect to GitHub';
    $('inboxBanner').hidden = true;
    load().then(function (text) {
      var p = C.parse(text); state.head = p.head; state.items = p.items; render();
      setStatus(gh ? '' : 'Draft: changes are saved on this phone only');
      checkInbox();
    }).catch(function (err) {
      $('summary').textContent = 'The list could not be loaded';
      $('list').textContent = '';
      var p = document.createElement('p'); p.className = 'empty';
      p.textContent = err.message + (gh ? '. Open the filter button and check the GitHub connection.' : '. Reload the page to try again.'); $('list').appendChild(p);
    });
  }
  boot();
})();
</script>
</body>
</html>
